  const r = SAMPLES.symbol;
  const hit = r.items.find((i) => i.hit) || r.items[0];
  createRenderer(r, $("stageContent")).frame(hit.t + 300);
  // Zustand kurz NACH dem Fehlgriff: Sicht wieder frei, nur die Marke bleibt.
  $("stage").classList.add("spent");
  $("pressTag").className = "press-tag show bad";
  $("pressTag").textContent = "raus";
} else {
  // Eine Runde sind fünf Aufgaben. Gezeigt wird die erste, bei der es etwas
  // zu drücken gibt, kurz nachdem das passiert ist.
  const r = SAMPLES[view];
  const inst = createRenderer(r, $("stageContent"));
  const idx = Math.max(0, r.items.findIndex((it) => it.hit));
  const item = r.items[idx];
  const t = item.t + item.at + 300;
  inst.frame(t);
  $("timerbar").classList.toggle("off", r.bar === "none");
  const left = 1 - ((t - item.t) / r.stepInterval);
  $("timerFill").style.width = Math.max(0, left * 100) + "%";
}
</script>
</body>
</html>
