if (view === "home") { document.body.innerHTML = HOME; } else
if (view === "lobby") { document.body.innerHTML = LOBBY; }
else if (view === "final") { document.body.innerHTML = FINAL; }
else if (view === "flash") {
  const ov = $("overlay");
  ov.className = "overlay show flash";
  ov.innerHTML = `
    <div class="fl-delta plus">+1.375</div>
    <div class="fl-badges"><span class="fl-badge">BLITZ</span><span class="fl-badge mult">Serie &times;2.5</span></div>
    <div class="fl-win mine">RUNDE GEWONNEN</div>
    <div class="fl-truth">Ab dem Moment war Dr&uuml;cken richtig</div>`;
} else if (view === "prelude") {
  const ov = $("overlay");
  ov.className = "overlay show prelude";
  ov.innerHTML = `
    <div class="prompt">Drücke, sobald &#127826; auftaucht</div>
    <div class="hint">Suche im Raster</div>
    <div class="countdown">2</div>`;
} else if (view === "feedback") {
  const r = SAMPLES.symbol;
  createRenderer(r, $("stageContent")).frame(r.triggerAt + 200);
  const fb = $("feedback");
  fb.className = "feedback show fb-hit";
  fb.innerHTML = "TREFFER<small>241 ms</small>";
  $("stage").classList.add("pressed");
} else {
  const r = SAMPLES[view];
  const inst = createRenderer(r, $("stageContent"));
  // Bei einer Serie den ersten Treffer zeigen, sonst kurz nach dem Auslöser.
  let t;
  if (r.kind === "series") {
    const hit = r.items.find((i) => i.hit) || r.items[0];
    t = hit.t + 300;
  } else {
    t = r.triggerAt !== null ? r.triggerAt + 250 : r.duration * 0.6;
  }
  inst.frame(t);
  $("timerbar").classList.toggle("off", r.bar === "none");
  let left = 1;
  if (r.bar === "step" && r.stepInterval) left = 1 - (t % r.stepInterval) / r.stepInterval;
  else left = Math.max(0, 1 - t / r.duration);
  $("timerFill").style.width = (left * 100) + "%";
}
</script>
